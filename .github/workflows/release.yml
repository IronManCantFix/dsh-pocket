# dsh-pocket 自动构建 + GitHub Release 发布
#
# 触发：推送 tag（形如 v1.13.4）→ 自动执行：
#   1. npm ci 安装依赖
#   2. node client/build.mjs 重新构建前端（client.js 必须是最新构建，否则安装后
#      手机/设置页拿到旧前端）
#   3. 同步版本号（tag v1.13.4 → package.json version 1.13.4）
#   4. npm pack 打出 dsh-pocket-<版本>.tgz
#   5. gh release create 创建 GitHub Release 并上传 tgz
#
# 注意：工作流不做 npm test——本地测好（npm test 全绿）再打 tag 发布。
#
# 用法：
#   git tag v1.13.4 && git push origin v1.13.4
# 安装插件（URL 固定，永远最新）：
#   dsh plugin --profile web add "https://github.com/IronManCantFix/dsh-pocket/releases/latest/download/dsh-pocket.tgz" -w

name: build & release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: 安装依赖
        run: npm ci

      - name: 构建前端（client/index.jsx → client/client.js）
        run: node client/build.mjs

      - name: 同步版本（tag → package.json）
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node - "$VERSION" <<'EOF'
          const fs = require('fs');
          const v = process.argv[2];
          const d = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          d.version = v;
          fs.writeFileSync('package.json', JSON.stringify(d, null, 2) + '\n');
          console.log('version ->', v);
          EOF

      - name: 打 npm 包（生成 dsh-pocket-<版本>.tgz）
        run: npm pack

      - name: 版本同步提交回仓库（package.json 永远跟随最新 tag）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "版本无变更"
          else
            git commit -m "chore: sync version to ${GITHUB_REF_NAME#v} (release ${GITHUB_REF_NAME})"
            git push origin HEAD:main
          fi

      - name: 创建 GitHub Release 并上传 tgz（固定资产名 → latest 固定 URL）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 资产重命名为 dsh-pocket.tgz（gh 的 file#newname 语法）：
          # releases/latest/download/dsh-pocket.tgz 永远指向最新版，
          # 安装 URL 永久固定，以后更新无需换地址。
          printf '%s\n' \
            '自动构建发布 ✅' \
            '' \
            '安装（URL 固定，永远指向最新版）：' \
            '```sh' \
            'dsh plugin --profile web add "https://github.com/'"$GITHUB_REPOSITORY"'/releases/latest/download/dsh-pocket.tgz" -w' \
            '```' > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" \
            "dsh-pocket-${VERSION}.tgz#dsh-pocket.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DSH Pocket v${VERSION}" \
            --notes-file /tmp/notes.md
