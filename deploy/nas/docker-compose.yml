# dsh-pocket NAS 端部署（frps + caddy）
#
# 用途：把电脑上 dsh-pocket 代理（默认 3081）通过 frp 反向发布到 NAS，
#       手机访问 https://dsh.你的域名.com 即达电脑上的 dsh——国内直连最快、
#       URL 固定、不依赖任何第三方。
#
# 用法（三选一，NAS 系统不同）：
#   群晖 Container Manager：File Station 建目录 → 上传本目录文件 →
#      Container Manager → 项目 → 新建 → 选择该目录 → 下一步启动。
#   威联通 Container Station：应用 → 创建 → docker-compose → 粘贴 docker-compose.yml。
#   任意 Linux：docker compose up -d
#
# 一次性配置：
#   1. 编辑 frps.toml：auth.token 改成 `openssl rand -hex 16` 生成的值，
#      并填到电脑 dsh-pocket 设置页「NAS 反向隧道」的连接令牌里（必须一致）。
#   2. 编辑 Caddyfile：dsh.你的域名.com 换成你的域名（A 记录解析到 NAS 公网 IP）。
#   3. NAS 防火墙放行：443/80（caddy HTTPS）与 7000（frps 控制端口）。
#      SSH 不需要开放。
#   4. 电脑 dsh-pocket 设置页 → 「NAS 反向隧道」→ 填 NAS 地址（域名）+ 令牌 →
#      保存 → 开启隧道 → 状态变「已连接」。
#   5. 手机打开 https://dsh.你的域名.com → 输入电脑设置页的「局域网访问密码」。
#
# 注意：frps 镜像版本必须与插件内置 frpc 版本一致（当前 0.71.0）。
#       frp 升级大版本时两端同步更新。

services:
  frps:
    image: snowdreamtech/frps:0.71.0
    container_name: frps
    restart: unless-stopped
    # host 网络：直通 NAS 网络栈，caddy 可直接访问 127.0.0.1:7001
    network_mode: host
    volumes:
      - ./frps.toml:/etc/frp/frps.toml

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
