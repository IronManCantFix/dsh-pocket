# dsh-pocket NAS 端部署（仅 frps）——配合 NAS 系统自带反向代理
#
# 适用：群晖/威联通等系统自带反向代理能力的 NAS。
# 为什么不用 caddy：NAS 系统的 Web 管理界面默认占用 80/443，
#   caddy 用 host 网络绑定会报 "address already in use"；改用系统自带
#   反向代理（同样支持 HTTPS + Let's Encrypt），无需 caddy 容器。
#
# 用法：
#   1. 编辑 frps.toml：auth.token 改成 openssl rand -hex 16 生成的值
#      （与电脑 dsh-pocket 设置页「NAS 反向隧道」的令牌一致）。
#   2. docker compose -f docker-compose.frps-only.yml up -d
#      （或群晖 Container Manager → 项目 → 粘贴本文件）
#   3. 在 NAS 系统里配反向代理（以群晖 DSM 7 为例）：
#      控制面板 → 登录门户 → 高级 → 反向代理 → 新增：
#        来源：协议 HTTPS · 主机名 dsh.你的域名.com · 端口 443
#        目的地：协议 HTTP · 主机名 localhost · 端口 7001
#      证书：控制面板 → 安全性 → 证书 → 新增 → 从 Let's Encrypt 获取
#        （域名 dsh.你的域名.com），申请后证书会自动匹配该域名。
#   4. 防火墙放行 443/80（NAS 系统）与 7000（frps 控制端口）；SSH 不用开。
#   5. 电脑 dsh-pocket 设置页 → 「NAS 反向隧道」→ 填 NAS 地址 + 令牌 →
#      保存 → 开启隧道 → 状态「已连接」→ 手机访问 https://dsh.你的域名.com。

services:
  frps:
    image: snowdreamtech/frps:0.71.0-alpine
    container_name: frps
    restart: unless-stopped
    # host 网络：frps 的转发端口 7001 绑定 127.0.0.1（见 frps.toml 的 proxyBindAddr），
    # 只有 NAS 本机的反向代理能访问；7000 供电脑 frpc 连入。
    network_mode: host
    volumes:
      - ./frps.toml:/etc/frp/frps.toml
